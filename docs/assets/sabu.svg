<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="sabu-title sabu-description">
  <title id="sabu-title">Диск Сабу — форма каменного сосуда</title>
  <desc id="sabu-description">Условные вид сверху и профиль. Три загнутые внутрь области края, полая втулка и тонкий обод. Схема не является обмером или картой реставрации.</desc>
  <defs>
