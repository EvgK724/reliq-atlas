    <circle cx="500" cy="390" r="274" fill="none" stroke="#82efe1" stroke-width="6" filter="url(#sabu-glow)" opacity=".35"/>
    <g stroke="#82efe1" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
