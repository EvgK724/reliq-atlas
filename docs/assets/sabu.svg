      <stop stop-color="#82efe1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#82efe1" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="sabu-lobe" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e4b777" stop-opacity=".18"/>
      <stop offset="1" stop-color="#82efe1" stop-opacity=".06"/>
    </linearGradient>
    <filter id="sabu-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <mask id="sabu-apertures">
      <rect width="1000" height="800" fill="white"/>
      <g fill="black" stroke="black" stroke-width="2">
        <path d="M493 132 A266 266 0 0 0 257 262 C355 303 465 260 493 132Z"/>
        <path d="M493 132 A266 266 0 0 0 257 262 C355 303 465 260 493 132Z" transform="rotate(120 500 390)"/>
        <path d="M493 132 A266 266 0 0 0 257 262 C355 303 465 260 493 132Z" transform="rotate(240 500 390)"/>
        <circle cx="500" cy="390" r="38"/>
      </g>
    </mask>
