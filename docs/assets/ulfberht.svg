<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="ulfberht-title ulfberht-desc">
<title id="ulfberht-title">Меч с надписью Ulfberht и варианты структуры</title><desc id="ulfberht-desc">Авторская схема клинка с условной орнаментацией. Разрезы показывают варианты в исследованной группе и не являются анализом конкретного музейного меча L.2006.57.</desc>
