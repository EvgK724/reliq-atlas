<title id="lycurgus-title">Кубок Ликурга: свет и цвет</title><desc id="lycurgus-desc">Авторская неоновая схема с условным мифологическим декором. Красный и зелёный относятся к разным режимам освещения. Металлическая оправа более поздняя.</desc>
